version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      tools-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
